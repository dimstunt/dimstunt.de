<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="/style.css">
<style>
body{margin:0;width:1200px;height:630px;overflow:hidden;background:var(--yellow);color:var(--ink);position:relative;
background:radial-gradient(circle at 1px 1px, color-mix(in oklch, var(--ink) 14%, transparent) 1px, transparent 1.6px) 0 0/7px 7px, var(--yellow)}
.n{position:absolute;left:72px;top:70px;font:900 150px/.84 var(--display);text-transform:uppercase}
.n span{display:block}.n span+span{color:var(--yellow);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:9px 9px 0 var(--ink)}
.t{position:absolute;left:76px;top:356px;font:700 38px var(--text);text-transform:uppercase;letter-spacing:.02em}
.c{position:absolute;right:64px;top:110px;width:330px;background:var(--ink);color:var(--paper);padding:26px 28px;clip-path:var(--chamfer);font:600 24px/1.5 var(--text)}
.c b{display:block;font:700 15px var(--data);color:var(--yellow);letter-spacing:.08em;margin-bottom:10px}
.c i{font-style:normal;color:var(--cyan)}
.u{position:absolute;left:76px;top:430px;font:500 26px var(--data)}
.s{position:absolute;right:48px;top:80px;rotate:7deg;background:var(--acid);padding:10px 14px;font:400 17px/1.2 var(--pixel);text-transform:uppercase;width:210px;box-shadow:4px 7px 12px #0006}
.h{position:absolute;left:0;right:0;bottom:0;height:34px;background:repeating-linear-gradient(-45deg,var(--ink) 0 26px,var(--yellow) 26px 52px)}
</style></head><body>
<div class="n"><span>Dmitrii</span><span>Cherkashin</span></div>
<div class="t">Data engineer · snowboarder</div>
<div class="u">dimstunt.de</div>
<div class="c"><b>OPERATIVE CARD</b>Contract: <i>Welltory</i><br>9 years · lakehouses<br>Montevideo · remote</div>
<div class="s">Survived an 80× data surge</div>
<div class="h"></div>
</body></html>
